# Local development database. Same PostgreSQL major version as production (RDS).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: brivo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/bootstrap-roles.sql:/docker-entrypoint-initdb.d/01-bootstrap-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brivo"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
