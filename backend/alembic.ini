# Alembic configuration. The database URL is NOT set here: migrations/env.py reads
# BRIVO_MIGRATION_DATABASE_URL (or BRIVO_DATABASE_URL) from the environment or backend/.env.
#
#   make migrate                             apply all pending migrations
#   make migrate-status                      show the current revision
#   make migration name="add participant"    create the next numbered migration

[alembic]
script_location = %(here)s/migrations
# Numbered files, e.g. 0002_add_participant.py
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
