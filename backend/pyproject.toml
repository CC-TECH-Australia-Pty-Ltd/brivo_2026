[project]
name = "brivo-clinical-system"
version = "0.1.0"
description = "Brivo Clinical System - API and worker (Stage 1)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "uuid-utils>=0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brivo"]

# ---------- Lint and format ----------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "N"]
ignore = ["S101"] # assert is fine in tests


# ---------- Types ----------
[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["brivo"]
plugins = ["pydantic.mypy"]

# ---------- Tests ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running PostgreSQL (DATABASE_URL)"]

# ---------- Module boundaries ----------
# Run with: uv run lint-imports
[tool.importlinter]
root_package = "brivo"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Scoring is pure: no database, web framework or I/O"
type = "forbidden"
source_modules = ["brivo.modules.scoring"]
forbidden_modules = ["brivo.core.db", "sqlalchemy", "fastapi", "httpx", "psycopg"]

[[tool.importlinter.contracts]]
name = "Feature modules do not import each other directly"
type = "independence"
modules = [
    "brivo.modules.participants",
    "brivo.modules.assessments",
    "brivo.modules.content_library",
    "brivo.modules.evidence",
    "brivo.modules.notifications",
]

[[tool.importlinter.contracts]]
name = "Core does not depend on feature modules"
type = "forbidden"
source_modules = ["brivo.core"]
forbidden_modules = ["brivo.modules"]
