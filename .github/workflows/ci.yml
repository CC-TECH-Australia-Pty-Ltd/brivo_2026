# Runs on every pull request and on main. All checks must pass before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, boundaries, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Throwaway PostgreSQL for tests. Never the shared Supabase or RDS database.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: brave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d brave"
          --health-interval 2s --health-timeout 3s --health-retries 20

    env:
      BRAVE_ENVIRONMENT: test
      BRAVE_DATABASE_URL: postgresql+psycopg://brave_app:brave_app@localhost:5432/brave
      BRAVE_MIGRATION_DATABASE_URL: postgresql+psycopg://brave_owner:brave_owner@localhost:5432/brave

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Module boundaries
        run: uv run lint-imports

      - name: Create database roles
        working-directory: .
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d brave -f db/bootstrap-roles.sql

      - name: Migrations on an empty database
        run: |
          uv run python -m brave.migrate up
          uv run python -m brave.migrate status

      - name: Tests (including tenant isolation)
        run: uv run pytest

  frontend:
    name: Frontend (lint, type check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
