# Runs on every pull request and on main. All checks must pass before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, boundaries, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Throwaway PostgreSQL for tests. Never the shared Supabase or RDS database.
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: brivo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d brivo"
          --health-interval 2s --health-timeout 3s --health-retries 20

    env:
      BRIVO_ENVIRONMENT: test
      BRIVO_DATABASE_URL: postgresql+psycopg://brivo_app:brivo_app@localhost:5432/brivo
      BRIVO_MIGRATION_DATABASE_URL: postgresql+psycopg://brivo_owner:brivo_owner@localhost:5432/brivo

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Module boundaries
        run: uv run lint-imports

      - name: Create database roles
        working-directory: .
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d brivo -f db/bootstrap-roles.sql

      - name: Migrations on an empty database
        run: |
          uv run alembic upgrade head
          uv run alembic current

      - name: Single migration head
        run: test "$(uv run alembic heads | wc -l)" -eq 1

      - name: Migration preview (SQL that main would run)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          prev=$(git ls-tree --full-tree --name-only FETCH_HEAD backend/migrations/versions/ \
            | sed -n 's#.*/\([0-9]\{4\}\)_[^/]*\.py$#\1#p' | sort | tail -n 1)
          head=$(uv run alembic heads | awk '{print $1}')
          if [ "$prev" = "$head" ]; then
            echo "No new migrations in this PR." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Migration SQL (${prev:-empty} → $head)"
              echo '```sql'
              uv run alembic upgrade "${prev:+$prev:}$head" --sql
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tests (including tenant isolation)
        run: uv run pytest

  frontend:
    name: Frontend (lint, type check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
