# Security checks: on every pull request and weekly, so new vulnerabilities in
# existing dependencies are caught even when no code changes.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * 0" # Sunday 20:17 UTC (Monday morning in Adelaide)

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    # The open-source gitleaks CLI, not gitleaks-action (which needs a paid licence
    # for organisation repos). Image pinned by digest; bump by hand.
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        run: |
          set -o pipefail
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --redact --no-banner --no-color --exit-code 1 2>&1 | tee gitleaks.log
          # A scan that read nothing must not pass.
          if grep -q ' 0 commits scanned' gitleaks.log; then
            echo "::error::gitleaks scanned 0 commits"
            exit 1
          fi

  code:
    name: Code scanning (Semgrep)
    runs-on: ubuntu-latest
    container:
      # Pinned by digest; Dependabot does not update workflow container images,
      # so bump this by hand (see docs/security/checklist.md).
      image: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          semgrep scan --error --metrics=off
          --config p/python --config p/typescript --config p/secrets --config p/owasp-top-ten

  dependencies:
    name: Dependency and config scanning (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
